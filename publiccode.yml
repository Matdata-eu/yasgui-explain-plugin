description:
  en:
    shortDescription: Shows how a SPARQL endpoint executes a query, with the execution plan of
      the engine and the SPARQL algebra, in YASGUI and MatGUI.
    longDescription: |
      This plugin adds an Explain view to the results of a SPARQL query. It shows the execution plan of the triple store, asked from the endpoint after the query ran: the operations the engine executed, with the rows and the time of each, for QLever, GraphDB, Stardog, Blazegraph and Amazon Neptune. For any endpoint it also shows the SPARQL algebra of the query, as a tree and as the s-expression used by the SPARQL specification, computed in the browser.

      It helps to understand why a query is slow, which join or scan takes the time, and how the engine reads the query. It works in YASGUI and in MatGUI, where it is included by default.
    documentation: https://github.com/Matdata-eu/yasgui-plan-plugin#readme
    features:
    - Execution plan with time and rows per operation (QLever)
    - Execution plans of GraphDB, Stardog, Blazegraph and Neptune
    - SPARQL algebra of any query, as a tree and as s-expression
    - Engine detection from the endpoint URL, with a manual choice remembered per endpoint
    - Light and dark theme
